version: '3.8'

services:
  # Primary Relational Database
  postgres:
    image: postgres:15-alpine
    container_name: dual_engine_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: telegram_bot_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d telegram_bot_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # In-Memory Cache, Dedup & Queue Broker
  redis:
    image: redis:7-alpine
    container_name: dual_engine_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Telegram Bot Service (Async python-telegram-bot v21+)
  bot:
    build: .
    container_name: dual_engine_bot
    restart: always
    command: >
      sh -c "python scripts/init_db.py && python -m bot.app"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # FastAPI Webhook Server (PubSubHubbub & Payment Gateway)
  webhook_server:
    build: .
    container_name: dual_engine_webhooks
    restart: always
    command: uvicorn webhooks.server:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Celery Background Worker (Social polling, verifications, escrow timeouts)
  worker:
    build: .
    container_name: dual_engine_celery_worker
    restart: always
    command: celery -A workers.celery_app worker --loglevel=info --concurrency=4
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Celery Beat (Periodic scheduler for 15-min polling & deadline monitors)
  celery_beat:
    build: .
    container_name: dual_engine_celery_beat
    restart: always
    command: celery -A workers.celery_app beat --loglevel=info
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:

